# XcodeGen-Projektdefinition — erzeugt reproduzierbar AirlockWriter.xcodeproj.
#
#   brew install xcodegen
#   cd ios-writer && xcodegen generate
#   open AirlockWriter.xcodeproj
#
# Danach unter „Signing & Capabilities" dein Apple-Team setzen (oder unten
# DEVELOPMENT_TEAM eintragen) und auf einem echten iPhone bauen. Die NFC-
# Capability steckt bereits in AirlockWriter/AirlockWriter.entitlements.
name: AirlockWriter

options:
  bundleIdPrefix: de.sweidinger
  deploymentTarget:
    iOS: "17.0"          # ContentUnavailableView / .topBarTrailing brauchen iOS 17
  createIntermediateGroups: true
  minimumXcodeGenVersion: "2.38.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"   # nur iPhone (Core NFC gibt es nicht auf iPad)
    DEVELOPMENT_TEAM: ""          # <- deine Apple-Team-ID hier eintragen (optional)

targets:
  AirlockWriter:
    type: application
    platform: iOS
    sources:
      - path: AirlockWriter
        excludes:
          - "Info.plist"                 # via INFOPLIST_FILE eingebunden
          - "AirlockWriter.entitlements" # via CODE_SIGN_ENTITLEMENTS eingebunden
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.sweidinger.airlockwriter
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: AirlockWriter/Info.plist
        CODE_SIGN_ENTITLEMENTS: AirlockWriter/AirlockWriter.entitlements
        CODE_SIGN_STYLE: Automatic
