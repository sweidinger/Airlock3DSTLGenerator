name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: OpenSCAD + Schriften installieren
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends openscad fonts-liberation fonts-dejavu-core
      - name: Abhängigkeiten
        run: pip install -r requirements-dev.txt
      - name: Tests
        run: pytest -q

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Docker-Image bauen (Validierung)
        run: >-
          docker build
          --build-arg GIT_SHA=${GITHUB_SHA::7}
          --build-arg BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          -t airlock-stl-generator:ci .

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, docker-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: GitHub-Release erstellen
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
