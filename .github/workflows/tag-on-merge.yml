name: Tag on merged PR

# Erzeugt bei jedem gemergten PR auf main einen Release-Tag v<VERSION>
# (aus der VERSION-Datei). Existiert der Tag schon, passiert nichts.
# So entstehen echte Versions-Tags statt Test-Tags, und der Release-Workflow
# (ci.yml, on: push tags v*) baut daraus automatisch ein GitHub-Release.

on:
  pull_request:
    types: [closed]

jobs:
  tag-on-merge:
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Tag v<VERSION> erstellen (falls neu)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [ -z "$VERSION" ]; then
            echo "VERSION-Datei leer oder fehlt - abbrechen."; exit 0
          fi
          TAG="v${VERSION}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} existiert bereits - nichts zu tun."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "${TAG}"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}" "refs/tags/${TAG}"
          echo "Tag ${TAG} erstellt und gepusht."
